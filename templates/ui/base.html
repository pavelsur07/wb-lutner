<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Заказы{% endblock %} — wb-lutner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand">wb-lutner</span>
    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a class="nav-link {{ 'active' if active == 'wb' }}" href="{{ url_for('ui.wb_orders') }}">Wildberries</a>
      </li>
      <li class="nav-item">
        <a class="nav-link {{ 'active' if active == 'ozon' }}" href="{{ url_for('ui.ozon_orders') }}">Ozon</a>
      </li>
    </ul>
  </div>
</nav>
<main class="container-fluid">
  {% block content %}{% endblock %}
</main>
</body>
</html>
