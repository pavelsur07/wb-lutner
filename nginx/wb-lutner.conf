# /etc/nginx/sites-available/wb-lutner.conf
# limit_req_zone объявляется в http-блоке /etc/nginx/nginx.conf:
#   limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/m;

server {
    listen 80;
    server_name YOUR_DOMAIN;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # ssl_certificate ... — допишет certbot --nginx

    client_max_body_size 1m;

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        # После 2-3 дней логов добавить allowlist IP Lutner и 'deny all;'
        limit_req zone=webhook_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
